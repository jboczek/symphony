services:
  playwright:
    build:
      context: .
      dockerfile: docker/playwright/Dockerfile
    image: symphony-playwright:1.63.0-alpha-2026-08-05
    container_name: symphony-playwright
    init: true
    restart: unless-stopped
    ipc: host
    ports:
      - "127.0.0.1:3000:3000"
    extra_hosts:
      - "hostmachine:host-gateway"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const net=require('net');const s=net.connect(3000,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 10s
